[project]
name = "distillcourse"
version = "0.1.0"
description = "Open a distillcourse lab from a notebook and submit its checkpoints."
# Colab's floor. Everything here installs and runs there unchanged, which is
# also why the dependency list is two entries long.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distill"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    # No `T201`: the backend bans `print`, but here the printed line is the
    # whole interface.
]
ignore = [
    "E501",  # line too long, handled by the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
